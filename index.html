<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Still Focus</title>
<meta name="description" content="Still Focus — uma ferramenta minimalista de foco, com ambiente visual personalizável e uma camada ASCII viva.">
<meta name="theme-color" content="#0a0e13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Layer 1: full-screen background -->
  <div id="bg-layer" aria-hidden="true"></div>

  <!-- Layer 2: ordered-dithering stylization -->
  <canvas id="dither-canvas" aria-hidden="true"></canvas>

  <!-- Layer 3: ASCII atmospheric overlay -->
  <canvas id="ascii-canvas" aria-hidden="true"></canvas>

  <!-- Layer 3: application UI -->
  <div id="app">

    <header class="app-header">
      <span class="brand">Stillfocus</span>
      <button id="settings-btn" class="icon-btn" type="button" aria-haspopup="dialog" aria-controls="settings-overlay" aria-label="Abrir configurações">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <main class="stage">

      <div class="task-row">
        <div class="task-input" id="task-input" contenteditable="true" role="textbox" aria-multiline="false" aria-label="O que você quer focar" data-placeholder="What you want to focus on..."></div>
      </div>

      <div class="mode-row" role="group" aria-label="Modo do Pomodoro">
        <button class="mode-pill" type="button" data-mode="focus">Focus</button>
        <button class="mode-pill" type="button" data-mode="short">Short Break</button>
        <button class="mode-pill" type="button" data-mode="long">Long Break</button>
      </div>

      <div class="timer" id="timer" role="timer" aria-live="off">25:00</div>

      <div class="controls">
        <button id="start-btn" class="btn-primary" type="button">
          <svg class="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          <span class="btn-label">Start</span>
        </button>
        <button id="reset-btn" class="icon-btn ghost" type="button" aria-label="Reiniciar timer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button id="fullscreen-btn" class="icon-btn ghost" type="button" aria-label="Entrar em tela cheia">
          <svg class="icon-fs-enter" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          <svg class="icon-fs-exit" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M21 16h-3a2 2 0 0 0-2 2v3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
        </button>
      </div>

      <p class="session-hint" id="session-hint">um período de foco</p>

    </main>

    <footer class="app-footer">
      <p class="date-display" id="date-display" aria-hidden="true"></p>
    </footer>

  </div>

  <!-- Settings dialog -->
  <div id="settings-overlay" class="overlay" hidden>
    <div class="settings-panel glass" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-header">
        <h2 id="settings-title">Configurações</h2>
        <button id="close-settings" class="icon-btn" type="button" aria-label="Fechar configurações">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="settings-scroll">

        <section class="settings-section">
          <h3>Durações</h3>
          <div class="duration-grid">
            <label class="duration-field">
              <span>Focus</span>
              <div class="num-input"><input type="number" id="dur-focus" min="1" max="180" inputmode="numeric"><span class="unit">min</span></div>
            </label>
            <label class="duration-field">
              <span>Short Break</span>
              <div class="num-input"><input type="number" id="dur-short" min="1" max="60" inputmode="numeric"><span class="unit">min</span></div>
            </label>
            <label class="duration-field">
              <span>Long Break</span>
              <div class="num-input"><input type="number" id="dur-long" min="1" max="90" inputmode="numeric"><span class="unit">min</span></div>
            </label>
          </div>
        </section>

        <section class="settings-section">
          <h3>Ambiente</h3>
          <div class="bg-type-tabs" role="tablist" aria-label="Tipo de background">
            <button class="bg-tab" type="button" data-bgtype="default" role="tab">Padrão</button>
            <button class="bg-tab" type="button" data-bgtype="solid" role="tab">Cor</button>
            <button class="bg-tab" type="button" data-bgtype="gradient" role="tab">Gradiente</button>
            <button class="bg-tab" type="button" data-bgtype="image" role="tab">Imagem</button>
          </div>

          <div id="bg-panel-solid" class="bg-panel" hidden>
            <input type="color" id="solid-color-input" value="#16233c" aria-label="Escolher cor sólida">
          </div>

          <div id="bg-panel-gradient" class="bg-panel" hidden>
            <div class="gradient-presets" id="gradient-presets"></div>
          </div>

          <div id="bg-panel-image" class="bg-panel" hidden>
            <label class="file-drop" for="image-input">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 5 17 10"/><line x1="12" y1="5" x2="12" y2="15"/></svg>
              <span>Escolher imagem</span>
            </label>
            <input type="file" id="image-input" accept="image/*" hidden>
          </div>

          <button id="reset-bg-btn" class="text-btn" type="button">Restaurar background padrão</button>
        </section>

        <section class="settings-section">
          <h3>Tipografia</h3>
          <div class="bg-type-tabs" role="tablist" aria-label="Peso da fonte">
            <button class="weight-tab" type="button" data-weight="300" role="tab">Light</button>
            <button class="weight-tab" type="button" data-weight="400" role="tab">Regular</button>
            <button class="weight-tab" type="button" data-weight="800" role="tab">Extrabold</button>
          </div>
        </section>

        <section class="settings-section">
          <h3>Efeitos</h3>

          <div class="ascii-toggle-row">
            <span>Camada ASCII</span>
            <label class="switch">
              <input type="checkbox" id="ascii-toggle" checked>
              <span class="switch-track"><span class="switch-thumb"></span></span>
            </label>
          </div>

          <div class="ascii-toggle-row">
            <span>Ordered Dithering</span>
            <label class="switch">
              <input type="checkbox" id="dither-toggle">
              <span class="switch-track"><span class="switch-thumb"></span></span>
            </label>
          </div>

          <div class="slider-field" id="dither-intensity-field" hidden>
            <div class="slider-label-row">
              <span>Quantidade</span>
              <span id="dither-intensity-value" class="slider-value">40%</span>
            </div>
            <input type="range" id="dither-intensity" min="0" max="100" value="40">
          </div>

          <div class="ascii-toggle-row" id="dither-noise-row" hidden>
            <span>Ruído monocromático</span>
            <label class="switch">
              <input type="checkbox" id="dither-noise-toggle" checked>
              <span class="switch-track"><span class="switch-thumb"></span></span>
            </label>
          </div>
        </section>

      </div>
    </div>
  </div>

  <script src="ascii.js"></script>
  <script src="dither.js"></script>
  <script src="app.js"></script>
</body>
</html>
